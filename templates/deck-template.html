<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DECK_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme">
<script>
  // PDF export. reveal.js's print mode is opt-in via ?print-pdf — the matching
  // print stylesheet MUST be present in <head> BEFORE Reveal.initialize, so we
  // inject it synchronously here. Without this, ?print-pdf produces one long
  // scrolling page instead of one print page per slide.
  (function () {
    var isPrint = /print-pdf/gi.test(window.location.search);
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.type = 'text/css';
    link.href = 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/css/print/' +
                (isPrint ? 'pdf.css' : 'paper.css');
    document.head.appendChild(link);
  })();
</script>
<style>
  :root {
    --brand-primary: {{BRAND_PRIMARY}};
    --brand-primary-dark: {{BRAND_PRIMARY_DARK}};
    --brand-primary-light: {{BRAND_PRIMARY_LIGHT}};
    --brand-text: {{BRAND_TEXT}};
    --brand-muted: {{BRAND_MUTED}};
    --brand-border: {{BRAND_BORDER}};
    --brand-success: {{BRAND_SUCCESS}};
    --brand-warning: {{BRAND_WARNING}};
    --brand-error: {{BRAND_ERROR}};
    --font-display: 'Manrope', {{BRAND_FONT}}, system-ui, sans-serif;
    --font-body: {{BRAND_FONT}}, 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    /* Layered shadows for depth */
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 1px 2px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.05);
    --shadow-lg: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.08), 0 16px 40px rgba(0,0,0,0.04);
  }

  /* ─── Base typography ────────────────────────────────────────────────── */
  .reveal { font-family: var(--font-body); color: var(--brand-text); font-weight: 400; }
  .reveal h1, .reveal h2, .reveal h3, .reveal h4 {
    font-family: var(--font-display);
    color: var(--brand-text);
    text-transform: none;
    letter-spacing: -0.018em;
    font-weight: 700;
    line-height: 1.15;
  }
  .reveal h1 { font-size: 2.4em; }
  .reveal h2 {
    font-size: 1.5em;
    border-bottom: 3px solid var(--brand-primary);
    padding-bottom: 0.22em;
    margin-bottom: 0.55em;
    display: inline-block;
  }
  .reveal h3 { font-size: 1.15em; color: var(--brand-primary-dark); font-weight: 600; }
  .reveal a { color: var(--brand-primary); }
  .reveal strong { color: var(--brand-primary-dark); font-weight: 700; }
  .reveal code {
    background: var(--brand-primary-light);
    color: var(--brand-primary-dark);
    padding: 0.05em 0.45em;
    border-radius: 4px;
    font-size: 0.85em;
    font-family: var(--font-mono);
    border: 1px solid color-mix(in oklab, var(--brand-primary) 18%, transparent);
  }
  .reveal .progress { color: var(--brand-primary); height: 4px; }
  .reveal .controls { color: var(--brand-primary); bottom: 8px; right: 10px; }
  /* Slide number lives top-LEFT so it never collides with the .role-badge
     that sits top-right on every walkthrough slide. White-ish background +
     dark text reads on both light and dark/branded backgrounds. */
  .reveal .slide-number {
    top: 12px; left: 14px;
    right: auto; bottom: auto;
    background: rgba(255,255,255,0.88);
    color: #333;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 4px;
    padding: 0.2em 0.55em;
    font-family: var(--font-mono);
    font-size: 0.7em;
    z-index: 30;
  }

  /* ─── Inverted inline colors on dark / branded backgrounds ───────────── */
  .reveal section.has-dark-background,
  .reveal section[data-background-color] { color: white; }
  .reveal section.role-cover h1, .reveal section.role-cover h2, .reveal section.role-cover h3,
  .reveal section[data-background-color] h1,
  .reveal section[data-background-color] h2,
  .reveal section[data-background-color] h3 {
    color: white;
    border-color: rgba(255,255,255,0.55);
  }
  .reveal section.role-cover strong, .reveal section.role-cover a,
  .reveal section[data-background-color] strong,
  .reveal section[data-background-color] a {
    color: white;
    text-decoration-color: rgba(255,255,255,0.5);
  }
  .reveal section.role-cover code,
  .reveal section[data-background-color] code {
    background: rgba(255,255,255,0.16);
    color: white;
    border-color: rgba(255,255,255,0.3);
  }

  /* ─── Title slide — asymmetric, atmospheric ───────────────────────────── */
  .reveal section.title-slide {
    text-align: left;
    padding: 0 2.5em;
    background:
      radial-gradient(60% 50% at 18% 25%, color-mix(in oklab, var(--brand-primary) 8%, transparent) 0%, transparent 70%),
      radial-gradient(50% 40% at 88% 78%, color-mix(in oklab, var(--brand-primary-dark) 6%, transparent) 0%, transparent 70%);
  }
  .reveal section.title-slide::before {
    content: "";
    display: block;
    width: 64px; height: 4px;
    background: var(--brand-primary);
    margin: 0 0 1.4em 0;
  }
  .reveal section.title-slide h1 {
    font-size: 3.1em;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1;
    margin: 0 0 0.4em 0;
    max-width: 14ch;
  }
  .reveal section.title-slide h3,
  .reveal section.title-slide .subtitle {
    font-family: var(--font-body);
    font-size: 1.05em;
    font-weight: 400;
    color: var(--brand-text);
    border: none;
    margin: 0 0 2em 0;
    max-width: 50ch;
  }
  .reveal section.title-slide .meta {
    font-family: var(--font-mono);
    font-size: 0.55em;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brand-muted);
    font-weight: 500;
  }

  /* ─── Role chapter cover — branded with subtle texture ───────────────── */
  /* No overflow:hidden on the section itself — long blockquotes need to
     wrap, not be clipped. Padding 1.6em (was 2.5em) gives the text room
     inside the 1280px slide canvas. The gradient/dot mask lives on the
     ::before pseudo-element which IS clipped. */
  .reveal section.role-cover {
    background:
      radial-gradient(60% 50% at 25% 20%, rgba(255,255,255,0.16) 0%, transparent 60%),
      linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%);
    color: white;
    text-align: left;
    padding: 0 1.6em;
    position: relative;
    box-sizing: border-box;
  }
  .reveal section.role-cover::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    mask-image: linear-gradient(135deg, black 0%, black 40%, transparent 80%);
    -webkit-mask-image: linear-gradient(135deg, black 0%, black 40%, transparent 80%);
    overflow: hidden;
  }
  .reveal section.role-cover > * { position: relative; z-index: 1; max-width: 100%; }
  .reveal section.role-cover h1 {
    font-size: 2.4em;
    font-weight: 800;
    letter-spacing: -0.022em;
    margin: 0 0 0.55em 0;
    max-width: 100%;
    overflow-wrap: break-word;
    word-wrap: break-word;
    hyphens: auto;
  }
  .reveal section.role-cover blockquote {
    background: transparent;
    border: none;
    box-shadow: none;
    font-style: normal;
    font-size: 1em;
    line-height: 1.55;
    margin: 0;
    padding: 0;
    max-width: 38em;
    width: auto;
    quotes: none;
    color: rgba(255,255,255,0.92);
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  .reveal section.role-cover blockquote::before { content: ""; display: block; width: 40px; height: 3px; background: rgba(255,255,255,0.6); margin-bottom: 1em; }
  .reveal section.role-cover blockquote::after { content: none; }

  /* ─── Walkthrough slide ───────────────────────────────────────────────── */
  .reveal section.walkthrough { text-align: left; padding: 0 1em; }
  /* Cap the h2 max-width so long titles wrap before reaching the .role-badge
     in the top-right corner. Without this, a title like "Add details,
     evidence requirements, team" runs straight under the badge. */
  .reveal section.walkthrough h2 { max-width: calc(100% - 7em); }
  .reveal .screenshot {
    max-width: 100%;
    max-height: 54vh;
    border: 1px solid var(--brand-border);
    border-radius: 8px;
    background: white;
    box-shadow: var(--shadow-lg);
    object-fit: contain;
  }
  .reveal .screenshot-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 0.7em;
  }

  /* Broken-image fallback (a JS handler adds .screenshot-missing) */
  .reveal .screenshot-wrap.screenshot-missing {
    background: linear-gradient(135deg, var(--brand-primary-light) 0%, white 100%);
    border: 2px dashed var(--brand-primary);
    min-height: 36vh;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brand-primary-dark);
    font-size: 0.75em;
    font-weight: 600;
    flex-direction: column;
    gap: 0.4em;
  }
  .reveal .screenshot-wrap.screenshot-missing::before {
    content: "Screenshot pending";
    font-family: var(--font-display);
    font-size: 1.4em;
    font-weight: 700;
    color: var(--brand-primary);
  }
  .reveal .screenshot-wrap.screenshot-missing::after {
    content: "Run capture.py against the dev server to populate";
    font-style: italic;
    font-weight: 400;
    color: var(--brand-primary-dark);
    opacity: 0.75;
  }

  /* Default ul/ol */
  .reveal ol, .reveal ul { display: block; margin-left: 1em; text-align: left; font-size: 0.78em; }
  .reveal ol li, .reveal ul li { margin: 0.22em 0; line-height: 1.5; }

  /* ─── Numbered step lists ────────────────────────────────────────────── */
  /* CRITICAL: badge is absolutely positioned (NOT flex/text-indent) so inline-block
     children of the li (pills, code, strong) flow normally without whitespace collapse. */
  .reveal .steps {
    list-style: none;
    margin: 0 0 0.5em;
    padding: 0;
  }
  .reveal .steps li {
    position: relative;
    padding-left: 2.4em;
    margin-bottom: 0.55em;
    font-size: 0.8em;
    line-height: 1.5;
  }
  .reveal .step {
    position: absolute;
    left: 0;
    top: 0.05em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.7em;
    height: 1.7em;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%);
    color: white;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.78em;
    box-shadow: 0 2px 6px color-mix(in oklab, var(--brand-primary) 35%, transparent);
  }

  /* Staggered entrance for steps when slide becomes visible */
  .reveal section.present .steps li {
    animation: stepIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .reveal section.present .steps li:nth-child(1) { animation-delay: 0.10s; }
  .reveal section.present .steps li:nth-child(2) { animation-delay: 0.20s; }
  .reveal section.present .steps li:nth-child(3) { animation-delay: 0.30s; }
  .reveal section.present .steps li:nth-child(4) { animation-delay: 0.40s; }
  .reveal section.present .steps li:nth-child(5) { animation-delay: 0.50s; }
  .reveal section.present .steps li:nth-child(6) { animation-delay: 0.60s; }
  @keyframes stepIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── Role badge in slide corner ─────────────────────────────────────── */
  /* Top-right corner — slide-number was moved to top-left so the two no
     longer clash. Tight padding + ellipsis so a long label can't push off
     the slide. */
  .role-badge {
    position: absolute;
    top: 0.9em; right: 0.9em;
    background: var(--brand-primary-light);
    color: var(--brand-primary-dark);
    padding: 0.28em 0.8em;
    border-radius: 999px;
    font-size: 0.48em;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid color-mix(in oklab, var(--brand-primary) 50%, transparent);
    z-index: 5;
    white-space: nowrap;
    max-width: calc(100% - 2em);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ─── Status pills ───────────────────────────────────────────────────── */
  .pill {
    display: inline-block;
    padding: 0.2em 0.7em;
    border-radius: 999px;
    font-size: 0.85em;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    vertical-align: 0.05em;
  }
  .pill-pending  { background: #FFF8E5; color: #D97706; border: 1px solid #FFECB3; }
  .pill-approved { background: #E9FFF3; color: #04A850; border: 1px solid #C6FFE0; }
  .pill-rejected { background: #FFF2F0; color: #B81719; border: 1px solid #FED2CB; }
  .pill-overdue  { background: #FFF2F0; color: #B81719; border: 1px solid #FED2CB; }
  .pill-active   { background: #E9FFF3; color: #04A850; border: 1px solid #C6FFE0; }
  .pill-draft    { background: #F3F5F7; color: #555; border: 1px solid #D2D7E0; }
  .pill-review   { background: #FFF8E5; color: #D97706; border: 1px solid #FFECB3; }
  .pill-closed   { background: #F3F5F7; color: #555; border: 1px solid #D2D7E0; }

  /* ─── Layouts ─────────────────────────────────────────────────────────── */
  .two-col   { display: grid; grid-template-columns: 1fr 1fr;       gap: 1.6em; align-items: start; font-size: 0.82em; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr;   gap: 1.2em; align-items: start; font-size: 0.72em; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9em; }
  .kpi-card {
    background: white;
    border: 1px solid var(--brand-border);
    border-radius: 10px;
    padding: 1em 1.1em;
    text-align: left;
    box-shadow: var(--shadow-sm);
  }
  .kpi-card .num   { font-family: var(--font-display); font-size: 2.1em; font-weight: 800; color: var(--brand-primary); line-height: 1; letter-spacing: -0.02em; }
  .kpi-card .label { color: var(--brand-muted); font-size: 0.8em; margin-top: 0.4em; }

  /* ─── Callouts ───────────────────────────────────────────────────────── */
  .callout {
    background: var(--brand-primary-light);
    border-left: 4px solid var(--brand-primary);
    padding: 0.8em 1.2em;
    border-radius: 0 8px 8px 0;
    font-size: 0.78em;
    text-align: left;
    box-shadow: var(--shadow-sm);
    margin: 0.4em 0;
  }
  .callout.warn   { background: #FFF8E5; border-color: #D97706; }
  .callout.danger { background: #FFF2F0; border-color: #B81719; }
  .callout.info   { background: #EFF6FF; border-color: #2563EB; }

  /* ─── Footer logo (left) — slide number stays right ──────────────────── */
  .reveal .slides::after {
    content: "";
    position: fixed;
    bottom: 14px; left: 18px;
    background-image: url("{{LOGO_PATH}}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: left center;
    width: 90px; height: 26px;
    opacity: 0.5;
    pointer-events: none;
    z-index: 10;
  }

  /* ─── Floating left-side TOC / quick-nav panel ────────────────────────── */
  .toc-panel {
    position: fixed;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 260px;
    max-height: 88vh;
    background: rgba(255,255,255,0.97);
    border: 1px solid var(--brand-border);
    border-left: none;
    border-radius: 0 12px 12px 0;
    box-shadow: var(--shadow-lg);
    z-index: 100;
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    transition: transform 0.25s cubic-bezier(0.2,0.8,0.2,1);
  }
  /* When collapsed the panel slides fully off-screen — the floating opener button
     (.toc-fab) takes over as the affordance. */
  .toc-panel.collapsed {
    transform: translate(-100%, -50%);
    pointer-events: none;
  }
  .toc-panel__header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6em 0.9em;
    background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%);
    color: white;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: 0 12px 0 0;
  }
  .toc-panel__toggle {
    background: var(--brand-primary);
    color: white;
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .toc-panel__toggle:hover { background: var(--brand-primary-dark); }
  .toc-panel__list {
    flex: 1 1 auto;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 0.4em 0;
    text-align: left;
    font-size: 0.78rem;
  }
  .toc-panel__list li { margin: 0; padding: 0; line-height: 1.35; }
  .toc-panel__list a {
    display: flex;
    gap: 0.55em;
    align-items: baseline;
    padding: 0.42em 0.95em 0.42em 0.85em;
    color: var(--brand-text);
    text-decoration: none;
    border-left: 3px solid transparent;
  }
  .toc-panel__list a:hover { background: var(--brand-primary-light); }
  .toc-panel__list a.is-current {
    background: var(--brand-primary-light);
    border-left-color: var(--brand-primary);
    font-weight: 700;
    color: var(--brand-primary-dark);
  }
  .toc-panel__list .toc-num {
    flex: 0 0 1.6em;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--brand-muted);
  }
  .toc-panel__list a.is-current .toc-num { color: var(--brand-primary-dark); }
  .toc-panel__list .toc-section {
    padding: 0.7em 0.95em 0.25em;
    font-family: var(--font-display);
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--brand-primary-dark);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-top: 1px solid var(--brand-border);
    margin-top: 0.3em;
  }
  .toc-panel__list .toc-section:first-child { border-top: none; margin-top: 0; }

  /* ─── Export-to-PDF action (panel footer) ─────────────────────────────── */
  .toc-panel__footer {
    flex: 0 0 auto;
    padding: 0.6em 0.7em;
    border-top: 1px solid var(--brand-border);
  }
  .toc-export {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.6em 0.9em;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.78rem;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .toc-export:hover { filter: brightness(1.06); box-shadow: var(--shadow-md); }
  .toc-export svg { width: 15px; height: 15px; }

  /* ─── Print-mode hides UI chrome ─────────────────────────────────────── */
  /* When ?print-pdf is in the URL, reveal.js's pdf.css (loaded in <head>)
     takes over layout. Our extra UI gets out of the way for both the
     print-pdf preview AND the browser's normal print dialog. */
  body.is-print-pdf .toc-panel,
  body.is-print-pdf .toc-fab,
  body.is-print-pdf .reveal .controls,
  body.is-print-pdf .reveal .progress,
  body.is-print-pdf .reveal .slide-number { display: none !important; }

  @media (max-width: 1100px) {
    .toc-panel { width: 220px; }
  }

  /* ─── Floating opener button (visible only while panel is collapsed) ───── */
  .toc-fab {
    position: fixed;
    top: 50%;
    left: 16px;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%);
    color: white;
    box-shadow: 0 6px 18px color-mix(in oklab, var(--brand-primary) 45%, transparent), var(--shadow-md);
    z-index: 101;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  .toc-fab::before {
    /* Pulsing halo */
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: var(--brand-primary);
    opacity: 0.5;
    z-index: -1;
    animation: tocFabPulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  .toc-fab svg { width: 22px; height: 22px; }
  .toc-fab:hover { transform: translateY(-50%) scale(1.06); box-shadow: 0 8px 22px color-mix(in oklab, var(--brand-primary) 55%, transparent), var(--shadow-lg); }
  .toc-fab:active { transform: translateY(-50%) scale(0.98); }
  .toc-fab.is-hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-50%) scale(0.6);
  }
  .toc-fab.is-hidden::before { animation: none; }
  @keyframes tocFabPulse {
    0%   { transform: scale(1);   opacity: 0.55; }
    70%  { transform: scale(1.35); opacity: 0;    }
    100% { transform: scale(1.35); opacity: 0;    }
  }

  /* ─── Print-friendly (PDF export) ────────────────────────────────────── */
  @media print {
    .reveal section.present .steps li { animation: none !important; opacity: 1 !important; transform: none !important; }
    .reveal .screenshot { box-shadow: none; }
    .toc-panel { display: none !important; }
    .toc-fab { display: none !important; }
  }

  /* ─── Reduced motion ─────────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    .reveal section.present .steps li { animation: none; opacity: 1; transform: none; }
    .toc-fab::before { animation: none; }
  }
</style>
</head>
<body>
<div class="reveal">
  <div class="slides">
    <section data-markdown="slides.md"
             data-separator="^---$"
             data-separator-vertical="^--$"
             data-separator-notes="^Note:"
             data-charset="utf-8">
    </section>
  </div>
</div>

<aside class="toc-panel collapsed" id="tocPanel" aria-label="Slide navigation">
  <div class="toc-panel__header">
    <span>Quick Nav</span>
    <button class="toc-panel__toggle" id="tocToggle" type="button" aria-label="Collapse navigation" title="Collapse">&laquo;</button>
  </div>
  <ol class="toc-panel__list" id="tocList"></ol>
  <div class="toc-panel__footer">
    <button class="toc-export" id="tocExport" type="button" title="Export this deck as a landscape PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
      Export as PDF
    </button>
  </div>
</aside>
<button class="toc-fab" id="tocFab" type="button" aria-label="Open slide navigation" title="Slide navigation">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="4" y1="7"  x2="20" y2="7"/>
    <line x1="4" y1="12" x2="20" y2="12"/>
    <line x1="4" y1="17" x2="14" y2="17"/>
  </svg>
</button>

<script>
  // Replace broken <img.screenshot> elements with a styled placeholder card.
  // img error events don't bubble — so we listen on the window in capture phase.
  window.addEventListener('error', (e) => {
    if (e.target && e.target.tagName === 'IMG' && e.target.classList.contains('screenshot')) {
      e.target.style.display = 'none';
      const wrap = e.target.closest('.screenshot-wrap');
      if (wrap) wrap.classList.add('screenshot-missing');
    }
  }, true);
</script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
<script>
  // Rebrand the reveal.js speaker-notes popup. The notes plugin writes the popup
  // inline, hardcoding its title to "reveal.js - Speaker View" with no favicon.
  // The popup is same-origin, so once the plugin has written its shell (detected
  // via that title) we override the title and apply the deck's own favicon.
  (function () {
    const iconEl = document.querySelector('link[rel="icon"]');
    const faviconHref = iconEl ? iconEl.href : null;
    const faviconType = iconEl ? iconEl.getAttribute('type') : null;
    const nativeOpen = window.open.bind(window);
    window.open = function (url, name, features) {
      const popup = nativeOpen(url, name, features);
      if (popup && name === 'reveal.js - Notes') {
        const timer = setInterval(() => {
          if (popup.closed) return clearInterval(timer);
          const doc = popup.document;
          if (!doc || doc.title !== 'reveal.js - Speaker View') return;
          doc.title = 'Speaker Notes';
          if (faviconHref) {
            const icon = doc.querySelector('link[rel="icon"]') || doc.createElement('link');
            icon.rel = 'icon';
            if (faviconType) icon.type = faviconType;
            icon.href = faviconHref;
            if (!icon.parentNode) doc.head.appendChild(icon);
          }
          clearInterval(timer);
        }, 120);
        setTimeout(() => clearInterval(timer), 6000);
      }
      return popup;
    };
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
<script>
  Reveal.initialize({
    width: 1280, height: 720, margin: 0.06,
    minScale: 0.2, maxScale: 2.0,
    hash: true, history: true, slideNumber: 'c/t',
    progress: true, controls: true,
    transition: 'slide', backgroundTransition: 'fade',
    plugins: [RevealMarkdown, RevealNotes, RevealHighlight]
  }).then(() => {
    // ─── Build the floating TOC from the rendered slides ────────────────
    const list = document.getElementById('tocList');
    const panel = document.getElementById('tocPanel');
    const toggle = document.getElementById('tocToggle');
    const fab = document.getElementById('tocFab');
    if (!list || !panel || !toggle || !fab) return;

    function syncFab() {
      const collapsed = panel.classList.contains('collapsed');
      fab.classList.toggle('is-hidden', !collapsed);
    }

    function deriveLabel(section) {
      // 1) Role-cover (chapter divider) — show as a section header
      if (section.classList.contains('role-cover')) {
        const h1 = section.querySelector('h1');
        return { kind: 'section', text: h1 ? h1.textContent.trim() : 'Section' };
      }
      // 2) Title slide
      if (section.classList.contains('title-slide')) {
        const h1 = section.querySelector('h1');
        return { kind: 'slide', text: h1 ? h1.textContent.trim() : 'Title' };
      }
      // 3) Use the first heading, falling back to the first non-empty line
      const heading = section.querySelector('h1, h2, h3');
      if (heading) return { kind: 'slide', text: heading.textContent.trim() };
      const txt = (section.textContent || '').trim().split('\n')[0].slice(0, 60);
      return { kind: 'slide', text: txt || 'Slide' };
    }

    function build() {
      list.innerHTML = '';
      const sections = document.querySelectorAll('.reveal .slides > section');
      let slideNum = 0;
      sections.forEach((section, idx) => {
        const verticals = section.querySelectorAll(':scope > section');
        if (verticals.length) {
          verticals.forEach((v, vIdx) => addRow(v, idx, vIdx, ++slideNum));
        } else {
          addRow(section, idx, 0, ++slideNum);
        }
      });
    }

    function addRow(section, h, v, num) {
      const { kind, text } = deriveLabel(section);
      const li = document.createElement('li');
      if (kind === 'section') {
        li.className = 'toc-section';
        li.textContent = text;
      } else {
        const a = document.createElement('a');
        a.href = '#';
        a.dataset.h = h; a.dataset.v = v;
        a.innerHTML = `<span class="toc-num">${num}</span><span class="toc-label"></span>`;
        a.querySelector('.toc-label').textContent = text;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          Reveal.slide(Number(a.dataset.h), Number(a.dataset.v));
        });
        li.appendChild(a);
      }
      list.appendChild(li);
    }

    function highlight() {
      const idx = Reveal.getIndices();
      list.querySelectorAll('a').forEach(a => {
        const isCurrent = Number(a.dataset.h) === idx.h && Number(a.dataset.v) === (idx.v || 0);
        a.classList.toggle('is-current', isCurrent);
        if (isCurrent) a.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
    }

    toggle.addEventListener('click', () => {
      const collapsed = panel.classList.toggle('collapsed');
      toggle.textContent = collapsed ? '»' : '«';
      toggle.title = collapsed ? 'Expand' : 'Collapse';
      toggle.setAttribute('aria-label', collapsed ? 'Expand navigation' : 'Collapse navigation');
      syncFab();
    });

    fab.addEventListener('click', () => {
      panel.classList.remove('collapsed');
      toggle.textContent = '«';
      toggle.title = 'Collapse';
      toggle.setAttribute('aria-label', 'Collapse navigation');
      syncFab();
    });

    // ─── Export to landscape PDF ─────────────────────────────────────────
    // The print stylesheet is loaded synchronously in <head> based on the
    // URL — so here we just navigate to ?print-pdf in a new tab and trigger
    // window.print() once reveal has rendered the print layout.
    const exportBtn = document.getElementById('tocExport');
    if (exportBtn) {
      exportBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const url = new URL(location.href);
        url.hash = '';
        url.searchParams.set('print-pdf', '');
        const win = window.open(url.toString(), '_blank', 'noopener');
        if (!win) location.href = url.toString();
      });
    }
    if (/print-pdf/gi.test(location.search)) {
      document.body.classList.add('is-print-pdf');
      let printed = false;
      const printOnce = () => {
        if (printed) return;
        printed = true;
        setTimeout(() => window.print(), 250);
      };
      Reveal.on('pdf-ready', printOnce);
      // Safety timeout — pdf-ready may never fire if slides.md is blocked
      // by file:// CORS or similar.
      setTimeout(printOnce, 4000);
    }

    build();
    highlight();
    syncFab();
    Reveal.on('slidechanged', highlight);
    Reveal.on('ready', highlight);
  });
</script>
</body>
</html>
